name: Cold-start latency

on:
  pull_request:
    paths:
      - ext/**
      - src/**
      - benchmark/precompile/**
      - .github/workflows/precompile.yml
      - Project.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    # The setup PR adds PrecompileTools, while the benchmark requires identical
    # dependency metadata. The first workload PR removes this bootstrap guard.
    if: ${{ false }}
    name: Compare base and head
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: QuantumSavory/julia-precompile-benchmark@v3
